<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · Zelm 的信息资源库</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <script>
    (function () {
      var a = localStorage.getItem('zelm_token') || sessionStorage.getItem('zelm_token');
      if (a) window.location.replace('index.html');
    })();
  </script>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="overlay"></div>
  <div class="star-field" id="starField"></div>

  <div class="login-lang" id="loginLang">
    <button class="seg-btn" data-lang="zh">中文</button>
    <button class="seg-btn" data-lang="en">EN</button>
  </div>

  <main class="login-wrap">
    <section class="login-card glass">
      <div class="brand login-brand">
        <span class="brand-icon">◉</span>
        <span class="brand-text">Zelm</span>
      </div>
      <h1 class="login-title" data-i18n="regTitle">创建账号</h1>
      <p class="login-sub" data-i18n="regSub">注册后即可登录资源库</p>

      <form class="login-form" id="registerForm" autocomplete="off">
        <label class="login-field">
          <span class="login-label" data-i18n="username">用户名</span>
          <input type="text" id="regUser" data-i18n-placeholder="regUserPH" placeholder="设定用户名（至少 2 位）" autocomplete="username" maxlength="20" required>
        </label>
        <label class="login-field">
          <span class="login-label" data-i18n="password">密码</span>
          <input type="password" id="regPass" data-i18n-placeholder="regPassPH" placeholder="设定密码（至少 4 位）" autocomplete="new-password" maxlength="40" required>
        </label>
        <label class="login-field">
          <span class="login-label" data-i18n="confirm">确认密码</span>
          <input type="password" id="regPass2" data-i18n-placeholder="confirmPH" placeholder="再次输入密码" autocomplete="new-password" maxlength="40" required>
        </label>

        <label class="login-remember">
          <input type="checkbox" id="remember" checked>
          <span data-i18n="remember">记住我（下次免登录）</span>
        </label>

        <p class="login-error" id="regError" hidden></p>

        <button type="submit" class="login-btn" data-i18n="regBtn">注册并登录</button>
      </form>

      <p class="login-links">
        <a href="login.html" data-i18n="back">← 返回登录</a>
      </p>

      <p class="login-foot">© 2026 Zelm · 在幽静的夜里收集星光</p>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="register.js"></script>
</body>
</html>
