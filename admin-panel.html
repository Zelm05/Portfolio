<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 · Zelm 的信息资源库</title>
  <script>
    /* 仅管理员可访问（云端接口版） */
    (function () {
      var t = localStorage.getItem('zelm_token') || sessionStorage.getItem('zelm_token');
      var r = localStorage.getItem('zelm_role') || sessionStorage.getItem('zelm_role');
      if (!t || r !== 'admin') window.location.replace('admin.html');
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="admin-panel.css">
</head>
<body>
  <div class="bg-layer"></div>
  <div class="overlay"></div>
  <div class="star-field" id="starField"></div>

  <main class="admin-panel glass" id="adminPanel">
    <h1><span>⚙️</span> <span data-i18n="panelTitle">管理后台</span></h1>
    <p class="admin-sub" data-i18n="panelSub">查看用户、重置密码或删除账号</p>

    <div class="admin-toolbar">
      <span class="admin-count" id="userCount" data-i18n="userCount">共 0 位用户</span>
      <a class="admin-back" href="index.html" data-i18n="backSite">← 返回资源库</a>
    </div>

    <div class="user-table-wrap">
      <table class="user-table">
        <thead>
          <tr>
            <th data-i18n="colUsername">用户名</th>
            <th data-i18n="colActions">操作</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr><td colspan="2" class="admin-empty" data-i18n="loading">加载中…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="admin-toast" id="adminToast"></div>

  <script src="api.js"></script>
  <script src="admin-panel.js"></script>
</body>
</html>
