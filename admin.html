<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 · Zelm 的信息资源库</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
  <script>
    (function () {
      var a = localStorage.getItem('zelm_token') || sessionStorage.getItem('zelm_token');
      if (a) window.location.replace('index.html');
    })();
  </script>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="overlay"></div>
  <div class="star-field" id="starField"></div>

  <div class="login-lang" id="loginLang">
    <button class="seg-btn" data-lang="zh">中文</button>
    <button class="seg-btn" data-lang="en">EN</button>
  </div>

  <main class="login-wrap">
    <section class="login-card glass">
      <div class="brand login-brand">
        <span class="brand-icon">◉</span>
        <span class="brand-text">Zelm</span>
      </div>
      <h1 class="login-title" data-i18n="adminTitle">管理员登录</h1>
      <p class="login-sub" data-i18n="adminSub">管理员入口，仅限授权账号</p>

      <form class="login-form" id="adminForm" autocomplete="off">
        <label class="login-field">
          <span class="login-label" data-i18n="username">管理员账号</span>
          <input type="text" id="adminUser" data-i18n-placeholder="usernamePH" placeholder="输入管理员账号" autocomplete="username" required>
        </label>
        <label class="login-field">
          <span class="login-label" data-i18n="password">密码</span>
          <input type="password" id="adminPass" data-i18n-placeholder="passwordPH" placeholder="输入管理员密码" autocomplete="current-password" required>
        </label>

        <label class="login-remember">
          <input type="checkbox" id="remember" checked>
          <span data-i18n="remember">记住我（下次免登录）</span>
        </label>

        <p class="login-error" id="adminError" hidden></p>

        <button type="submit" class="login-btn" data-i18n="adminBtn">登 录</button>
      </form>

      <p class="login-links login-links-sub">
        <a href="login.html" data-i18n="backUser">← 返回用户登录</a>
      </p>

      <p class="login-foot">© 2026 Zelm · 在幽静的夜里收集星光</p>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
